name: build
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 180
    env:
      DYLIX_SDK_26_0: ${{ github.workspace }}/LocalSDKs/iPhoneOS26.0.sdk
    steps:
      - uses: actions/checkout@v4
      - run: brew install cmake ninja meson
      - run: rustup target add aarch64-apple-ios
      - run: python3 scripts/fetch_toolchain.py
      - run: python3 scripts/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: dylix-ipa
          path: build/*.ipa
